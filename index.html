    // Parser function
    function parseAnnouncement(text) {
      const clean = text.trim();
      const match = clean.match(/(?:od\s*)?([0-2]?\d:[0-5]\d)\s*(?:do|-)\s*([0-2]?\d:[0-5]\d)\s*(?:sati|h)?\s*[:-]?\s*(.*)/i);
      if (match) {
        const startHM = match[1];
        const endHM = match[2];
        let loc = match[3].replace(/^sati\s*/i, '').replace(/^-+\s*/, '').trim();
        const [sh, sm] = startHM.split(':').map(Number);
        const [eh, em] = endHM.split(':').map(Number);
        return {
          startHM,
          endHM,
          startMin: sh * 60 + sm,
          endMin: eh * 60 + em,
          location: loc || 'Redovna kontrola',
          raw: clean
        };
      }
      return {
        startHM: '00:00',
        endHM: '23:59',
        startMin: 0,
        endMin: 1439,
        location: clean,
        raw: clean
      };
    }

    // Dynamic radar events list
    let PARSED_EVENTS = [];

    function rebuildEvents(feed) {
      PARSED_EVENTS = [];
      feed.forEach(station => {
        station.announcements.forEach((ann, idx) => {
          const p = parseAnnouncement(ann);
          let roadBadge = station.road || 'Lokalni';
          const roadMatch = p.location.match(/\b([MARE]-\d+(\.\d+)?)\b/i);
          if (roadMatch) {
            roadBadge = roadMatch[1].toUpperCase();
          }

          PARSED_EVENTS.push({
            id: `${station.id}-${idx}`,
            station: station.station,
            town: station.town,
            canton: station.canton,
            roadBadge,
            location: p.location,
            startHM: p.startHM,
            endHM: p.endHM,
            startMin: p.startMin,
            endMin: p.endMin,
            raw: p.raw
          });
        });
      });
    }

    // App State - Uses Real Local Time
    let selectedTown = 'Fojnica';
    let selectedTab = 'active'; // 'active', 'upcoming', 'all'
    let searchQuery = '';

    // Get current minutes of day from device clock
    function getNowMinutes() {
      const d = new Date();
      return d.getHours() * 60 + d.getMinutes();
    }

    // Calculate dynamic status and countdown
    function calculateStatus(event, now) {
      if (now >= event.startMin && now <= event.endMin) {
        const remaining = event.endMin - now;
        const h = Math.floor(remaining / 60);
        const m = remaining % 60;
        const countdown = h > 0 ? `${h}h ${m}m` : `${m} min`;
        return {
          type: 'ACTIVE',
          badgeText: 'AKTIVAN',
          timeDesc: `Ističe za ${countdown}`,
          sortPriority: 1,
          remaining
        };
      } else if (now < event.startMin) {
        const startsIn = event.startMin - now;
        const h = Math.floor(startsIn / 60);
        const m = startsIn % 60;
        const countdown = h > 0 ? `${h}h ${m}m` : `${m} min`;
        return {
          type: 'UPCOMING',
          badgeText: 'USKORO',
          timeDesc: `Počinje za ${countdown}`,
          sortPriority: 2,
          startsIn
        };
      } else {
        const passed = now - event.endMin;
        const h = Math.floor(passed / 60);
        const m = passed % 60;
        return {
          type: 'EXPIRED',
          badgeText: 'ZAVRŠEN',
          timeDesc: `Završio prije ${h > 0 ? h + 'h ' : ''}${m}m`,
          sortPriority: 3,
          passed
        };
      }
    }

    // Set Općina via Dropdown
    function setOpćina(town) {
      selectedTown = town;

      const select = document.getElementById('select-opcina');
      if (select.value !== town) {

      }

      document.getElementById('active-opcina-badge').textContent = town === 'ALL' ? 'cijela BiH' : town;
      render();
    }

    // Render Feed Cards
    function render() {
      const grid = document.getElementById('radar-cards-grid');
      const emptyState = document.getElementById('radar-empty-state');
      const nowMin = getNowMinutes();

      // Filter by town
      let events = PARSED_EVENTS.filter(e => {
        if (selectedTown !== 'ALL' && e.town !== selectedTown) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchLoc = e.location.toLowerCase().includes(q);
          const matchTown = e.town.toLowerCase().includes(q);
          const matchRoad = e.roadBadge.toLowerCase().includes(q);
          const matchStation = e.station.toLowerCase().includes(q);
          if (!matchLoc && !matchTown && !matchRoad && !matchStation) return false;
        }
        return true;
      });

      // Status
      events = events.map(e => ({
        ...e,
        status: calculateStatus(e, nowMin)
      }));

      // Counts
      const activeCount = events.filter(e => e.status.type === 'ACTIVE').length;
      const upcomingCount = events.filter(e => e.status.type === 'UPCOMING').length;
      const allCount = events.length;

      document.getElementById('count-active').textContent = activeCount;
      document.getElementById('count-upcoming').textContent = upcomingCount;
      document.getElementById('count-all').textContent = allCount;

      // Filter by Tab
      let displayEvents = events;
      if (selectedTab === 'active') {
        displayEvents = events.filter(e => e.status.type === 'ACTIVE');
      } else if (selectedTab === 'upcoming') {
        displayEvents = events.filter(e => e.status.type === 'UPCOMING');
      }

      // Sort
      displayEvents.sort((a, b) => {
        if (a.status.sortPriority !== b.status.sortPriority) {
          return a.status.sortPriority - b.status.sortPriority;
        }
        return a.startMin - b.startMin;
      });

      grid.innerHTML = '';

      if (displayEvents.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      displayEvents.forEach(e => {
        const card = document.createElement('article');
        const isActive = e.status.type === 'ACTIVE';
        const isUpcoming = e.status.type === 'UPCOMING';

        let borderClass = 'border-[#e5e7eb] dark:border-[#29303d]';
        let badgeColor = 'bg-[#f3f4f6] dark:bg-[#1f242e] text-[#6b7280] dark:text-[#9ca3af]';

        if (isActive) {
          borderClass = 'border-[#fed100] dark:border-[#fed100] shadow-xs';
          badgeColor = 'bg-[#fed100] text-[#111827] font-extrabold border border-[#e5bc00]';
          timerColor = 'text-[#111827] dark:text-[#fed100] font-extrabold';
        } else if (isUpcoming) {
          borderClass = 'border-[#93c5fd] dark:border-[#1e3a5f]';
          badgeColor = 'bg-[#e0f2fe] dark:bg-[#0c2842] text-[#0369a1] dark:text-[#38bdf8] font-bold border border-[#bae6fd] dark:border-[#1e3a5f]';
          timerColor = 'text-[#0284c7] dark:text-[#38bdf8] font-bold';
        }

        const mapsQuery = encodeURIComponent(`${e.location}, ${e.town}, Bosnia`);
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;

        card.className = `p-4 rounded-xl border bg-white dark:bg-[#161a22] ${borderClass} transition-all space-y-3 flex flex-col justify-between`;
        card.innerHTML = `
          <div class="space-y-2">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2 py-0.5 rounded text-[11px] font-black bg-[#111827] dark:bg-[#fed100] text-white dark:text-[#111827] uppercase tracking-wider">${e.roadBadge}</span>

              </div>

              <span class="flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider ${badgeColor} flex-shrink-0">
                ${e.status.badgeText}
              </span>
            </div>

            <div>
              <h2 class="text-base font-bold text-[#111827] dark:text-white leading-snug">${e.location}</h2>
            </div>
          </div>

          <div class="pt-2.5 border-t border-[#f3f4f6] dark:border-[#232935] flex items-center justify-between gap-2 text-xs">
            <div class="flex items-center gap-2">
              <span class="font-mono font-bold text-sm text-[#111827] dark:text-white">${e.startHM} &ndash; ${e.endHM}</span>
              <span class="text-[#d1d5db] dark:text-[#374151]">&bull;</span>
              <span class="text-xs ${timerColor}">${e.status.timeDesc}</span>
            </div>

            <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-[#f8f9fa] dark:bg-[#1f242e] hover:bg-[#fed100] hover:text-[#111827] dark:hover:bg-[#fed100] dark:hover:text-[#111827] text-[#111827] dark:text-[#f3f4f6] font-bold text-xs flex items-center gap-1.5 transition-colors flex-shrink-0 border border-[#e5e7eb] dark:border-[#2b3342]">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin preview-icon"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
              <span>Navigacija</span>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Update real clock on device
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('current-clock').textContent = `${h}:${m}`;
    }

    // Fetch Live Feed automatically from /api/radari
    async function fetchLiveFeed() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          rebuildEvents(data);
          render();
        }
      } catch (err) {
        console.warn('API sync fallback to seed feed:', err);
      }
    }

      all: document.getElementById('tab-all')
    };

    function setTab(tabKey) {
      selectedTab = tabKey;
      Object.keys(tabElements).forEach(k => {
        if (k === tabKey) {
          tabElements[k].className = 'status-tab py-2 px-1 rounded-lg border transition-all bg-[#fed100] text-[#111827] border-[#e5bc00] shadow-xs font-extrabold cursor-pointer';
        } else {
          tabElements[k].className = 'status-tab py-2 px-1 rounded-lg border transition-all bg-[#f8f9fa] dark:bg-[#101319] border-[#e5e7eb] dark:border-[#29303d] text-[#4b5563] dark:text-[#9ca3af] hover:border-[#fed100] font-semibold cursor-pointer';
        }
      });
      render();
    }

    tabElements.active.addEventListener('click', () => setTab('active'));
    tabElements.upcoming.addEventListener('click', () => setTab('upcoming'));
    tabElements.all.addEventListener('click', () => setTab('all'));

    // Search Input
    const searchInput = document.getElementById('search-input');
    const clearSearch = document.getElementById('btn-clear-search');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearch.classList.toggle('hidden', searchQuery.length === 0);
      render();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.add('hidden');
      render();
    });

    // Theme Toggle
    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      try {
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      } catch (err) {}
    });

    // Header Refresh button
    document.getElementById('btn-refresh-header').addEventListener('click', () => {
      updateClock();
      fetchLiveFeed();
      render();
    });

    // Initial load
    rebuildEvents(SEED_RADAR_FEED);
    updateClock();
    fetchLiveFeed();

    // Clock ticker every second; re-render feed every 30 seconds to refresh countdowns
    setInterval(updateClock, 1000);
    setInterval(render, 30000);

    // Initial render
    setOpćina('Fojnica');
  </script>
</body>
</html>
